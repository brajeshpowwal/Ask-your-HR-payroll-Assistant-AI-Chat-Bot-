# Tool settings only; dependencies live in requirements.txt / requirements-dev.txt.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "app", "eval", "data", "tests"]
ignore_missing_imports = true
explicit_package_bases = true  # app/ has no __init__.py; resolve it as the "app" package from the repo root
warn_unused_ignores = true
warn_redundant_casts = true
