# Business rules the LLM must follow when it writes SQL.
# Change these to match your own company definitions.

snapshot_date: "2026-10-31"

rules:
  - "TODAY is the snapshot date 2026-10-31. Never use date('now') or CURRENT_DATE; use '2026-10-31' instead. 'Last 12 months' means dates > date('2026-10-31', '-12 months')."
  - "Active employee: employees.status = 'Active'. Headcount means number of active employees unless the user asks otherwise."
  - "Attrition (or turnover) count: employees whose termination_date falls in the period."
  - "Attrition rate for a period: terminations in the period / average of headcount at the start and at the end of the period, as a percentage. Headcount on a date D = hire_date <= D AND (termination_date IS NULL OR termination_date > D)."
  - "Current salary: the salaries row with the latest effective_date for each employee."
  - "Payroll cost (total cost to the company): SUM(gross_pay + employer_tax) from payroll_runs. 'Gross payroll' or 'gross pay' alone means SUM(gross_pay). Month of a payment = strftime('%Y-%m', pay_date)."
  - "Overtime cost: overtime_hours * (current annual_salary / 2080) * 1.5, or simply compare overtime_hours when cost is not needed."
  - "Open exceptions: payroll_exceptions.status IN ('Open', 'In Review') unless the user says only 'Open'. Age of an open exception in days = julianday('2026-10-31') - julianday(raised_date)."
  - "Duplicate payment: two or more payroll_runs rows with the same employee_id and pay_period_start."
  - "Absenteeism rate: attendance rows with status 'Absent' / all attendance rows except 'Holiday', as a percentage."
  - "Tenure in years: (julianday(COALESCE(termination_date, '2026-10-31')) - julianday(hire_date)) / 365.25."
  - "Latest review cycle is '2026-H1'. Top performers: rating >= 4."
  - "Department names repeat across companies. When grouping by department across the group, group by department_name; when the user names a company, also filter or group by company."
  - "Show employees as first_name || ' ' || last_name AS employee_name."
  - "Round money to 2 decimals and percentages to 1 decimal."
