# Business descriptions of every table and column.
# The agent sends these to the LLM together with the real schema, so it
# understands what the data MEANS, not just the column names.
# All data is fictional (generated by data/generate_data.py).

companies:
  description: The four fictional group companies. One row per company.
  columns:
    company_id: Primary key.
    company_name: "Company name: Brightwave Solutions, Cedarline Health, Northpeak Logistics or Orbitron Retail."
    industry: "Software, Healthcare, Logistics or Retail."
    hq_state: Two-letter US state of the head office.
    founded_year: Year the company was founded.

departments:
  description: Departments inside each company. Every company has Executive, Engineering, Sales, Finance, Human Resources and Customer Support.
  columns:
    department_id: Primary key.
    company_id: The company this department belongs to (companies.company_id).
    department_name: Department name. The same name exists in every company, so filter by company_id too when needed.
    cost_center: Finance cost-center code, e.g. CC-101.

employees:
  description: One row per employee, current and former. Each employee belongs to one company and one department.
  columns:
    employee_id: Primary key.
    company_id: Employer (companies.company_id).
    department_id: Department (departments.department_id).
    first_name: First name.
    last_name: Last name.
    email: Work email.
    job_title: "Job title, e.g. Senior Engineer, Support Manager, Head of Sales."
    job_level: "1 = Associate, 2 = Professional, 3 = Senior, 4 = Manager, 5 = Head of department, 6 = CEO."
    manager_id: The employee_id of this person's manager (self-join on employees). NULL only for CEOs.
    employment_type: "Full-time, Part-time or Contract."
    work_state: Two-letter US state where the employee works.
    hire_date: Hire date, text YYYY-MM-DD.
    termination_date: Last working day, text YYYY-MM-DD. NULL for active employees.
    termination_reason: "Resignation, Better Offer, Relocation, Performance, Layoff or Retirement. NULL if active."
    status: "'Active' or 'Terminated'."

salaries:
  description: Salary history. A new row is added at hire and at every raise or promotion. The CURRENT salary is the row with the latest effective_date per employee.
  columns:
    salary_id: Primary key.
    employee_id: Employee (employees.employee_id).
    effective_date: Date the salary started, text YYYY-MM-DD.
    annual_salary: Annual salary in USD.
    change_reason: "'New Hire', 'Annual Merit' or 'Promotion'."

payroll_runs:
  description: One row per employee per biweekly pay period (14 days), from 2024-11-01 to 2026-10-29. Some rows are accidental duplicate payments (same employee and same pay_period_start twice).
  columns:
    payroll_id: Primary key.
    employee_id: Employee paid.
    company_id: Company that paid.
    pay_period_start: First day of the pay period, YYYY-MM-DD.
    pay_period_end: Last day of the pay period, YYYY-MM-DD.
    pay_date: Date the money was paid, YYYY-MM-DD. Use this for "payroll in month X".
    regular_hours: Regular hours in the period (80 full-time, 40 part-time).
    overtime_hours: Overtime hours in the period, paid at 1.5x.
    gross_pay: Gross pay in USD before tax and deductions.
    tax_withheld: Tax withheld in USD.
    benefits_deduction: Benefits deduction in USD (0 for contractors).
    net_pay: Take-home pay in USD = gross_pay - tax_withheld - benefits_deduction.

payroll_exceptions:
  description: Payroll issues raised by the payroll team for a specific payroll row.
  columns:
    exception_id: Primary key.
    payroll_id: The payroll row with the issue (payroll_runs.payroll_id).
    employee_id: Employee affected.
    company_id: Company affected.
    exception_type: "Missing Timesheet, Overtime Spike, Incorrect Tax Withholding, Retro Pay Adjustment, Bank Detail Mismatch or Duplicate Payment."
    amount: USD amount at stake.
    status: "'Open', 'In Review' or 'Resolved'."
    raised_date: Date raised, YYYY-MM-DD.
    resolved_date: Date resolved, YYYY-MM-DD. NULL unless status is 'Resolved'.

attendance:
  description: Daily attendance for weekdays in the last 90 days (2026-08-03 to 2026-10-30).
  columns:
    attendance_id: Primary key.
    employee_id: Employee.
    work_date: Date, YYYY-MM-DD.
    status: "'Present', 'Leave', 'Absent' (unplanned, no leave) or 'Holiday'."
    hours_worked: Hours worked that day (0 when not present).
    leave_type: "'Annual', 'Sick' or 'Personal' when status = 'Leave', otherwise NULL."

performance_reviews:
  description: Half-yearly performance reviews done by the employee's manager.
  columns:
    review_id: Primary key.
    employee_id: Employee reviewed.
    reviewer_id: Manager who did the review (employees.employee_id).
    review_cycle: "Cycle label: '2024-H2', '2025-H1', '2025-H2' or '2026-H1'. Latest cycle is '2026-H1'."
    review_date: Date of the review, YYYY-MM-DD.
    rating: "1 = Unsatisfactory, 2 = Needs improvement, 3 = Meets expectations, 4 = Exceeds, 5 = Outstanding."

leave_balances:
  description: Current leave balance per active non-contract employee and leave type.
  columns:
    employee_id: Employee.
    leave_type: "'Annual', 'Sick' or 'Personal'."
    entitled_days: Days allowed this year.
    used_days: Days used this year.
    balance_days: Days remaining = entitled_days - used_days.
